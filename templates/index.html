<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pima Diabetes Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            align-items: center;
        }
        .form-group label {
            width: 50%;
            font-weight: bold;
            color: #555;
        }
        .form-group input {
            width: 45%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50; /* Green */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .positive {
            background-color: #ffdddd;
            border: 1px solid #f44336;
            color: #f44336;
        }
        /*.negative {*/
        /*    background-color: #ddffdd;*/
        /*    border: 1px solid #4CAF50;*/
        /*    color: #4CAF50;*/
        /*}*/
        .result-box h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Pima Indians Diabetes Prediction</h2>
        <form method="POST">
            <div class="form-group">
                <label for="Pregnancies">Pregnancies (Count)</label>
                <input type="number" step="1" name="Pregnancies" id="Pregnancies" required value="1">
            </div>
            <div class="form-group">
                <label for="Glucose">Glucose (Plasma glucose concentration)</label>
                <input type="number" step="0.1" name="Glucose" id="Glucose" required value="110">
            </div>
            <div class="form-group">
                <label for="BloodPressure">Blood Pressure (mm Hg)</label>
                <input type="number" step="0.1" name="BloodPressure" id="BloodPressure" required value="70">
            </div>
            <div class="form-group">
                <label for="SkinThickness">Skin Thickness (mm)</label>
                <input type="number" step="0.1" name="SkinThickness" id="SkinThickness" required value="30">
            </div>
            <div class="form-group">
                <label for="Insulin">Insulin (mu U/ml)</label>
                <input type="number" step="0.1" name="Insulin" id="Insulin" required value="100">
            </div>
            <div class="form-group">
                <label for="BMI">BMI (Body Mass Index)</label>
                <input type="number" step="0.01" name="BMI" id="BMI" required value="25.0">
            </div>
            <div class="form-group">
                <label for="DiabetesPedigreeFunction">Diabetes Pedigree Function</label>
                <input type="number" step="0.001" name="DiabetesPedigreeFunction" id="DiabetesPedigreeFunction" required value="0.5">
            </div>
            <div class="form-group">
                <label for="Age">Age (Years)</label>
                <input type="number" step="1" name="Age" id="Age" required value="30">
            </div>
            
            <button type="submit">Predict Diabetes Outcome</button>
        </form>

        {% if result %}
            <div class="result-box {% if result.prediction == 1 %}positive{% else %}negative{% endif %}">
                <h3>Prediction Result: {{ result.outcome_message }}</h3>
                <p><strong>Risk Level:</strong> {{ result.risk_level }}</p>
                <p>Probability of Diabetes: {{ result.probability_of_diabetes }} (Threshold: 0.40)</p>
            </div>
        {% elif error %}
            <div class="result-box positive">
                <h3>Prediction Error</h3>
                <p>{{ error }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
